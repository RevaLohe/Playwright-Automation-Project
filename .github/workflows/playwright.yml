name: Playwright Tests (Docker)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  test:
    name: Run tests in Docker
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build -t playwright-tests .

      - name: Create report directory
        run: mkdir -p playwright-report

      - name: Run Playwright tests in Docker
        env:
          SAUCE_DEMO_USERNAME: ${{ secrets.SAUCE_DEMO_USERNAME }}
          SAUCE_DEMO_PASSWORD: ${{ secrets.SAUCE_DEMO_PASSWORD }}
          RESTFUL_BOOKER_USERNAME: ${{ secrets.RESTFUL_BOOKER_USERNAME }}
          RESTFUL_BOOKER_PASSWORD: ${{ secrets.RESTFUL_BOOKER_PASSWORD }}
        run: |
          docker run --rm \
            --ipc=host \
            --init \
            -e CI=true \
            -e SAUCE_DEMO_USERNAME \
            -e SAUCE_DEMO_PASSWORD \
            -e RESTFUL_BOOKER_USERNAME \
            -e RESTFUL_BOOKER_PASSWORD \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            playwright-tests

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
